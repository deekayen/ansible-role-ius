---
- name: Validate role variables.
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always

- name: Ensure proxy is available.
  ansible.builtin.uri:
    url: "{{ proxy_url }}"
    method: CONNECT
    status_code: 500
    timeout: 2
  when: proxy_url | length > 0

- name: "DEBUG: print distribution major version number."
  ansible.builtin.debug:
    var: ansible_facts.distribution_major_version

- name: Add IUS release repository.
  become: true
  ansible.builtin.package:
    name: "{{ ius_repo_url }}/ius-release-el{{ ansible_facts.distribution_major_version }}.rpm"
    state: present
  notify: Update yum cache.
  when: ius_enable | bool

- name: Add IUS testing repository.
  become: true
  ansible.builtin.package:
    name: "{{ ius_repo_url }}/ius-testing-{{ ansible_facts.distribution_major_version }}.rpm"
    state: present
  register: ius_testing
  when: ius_enable_testing | bool

- name: Add IUS archive repository.
  become: true
  ansible.builtin.package:
    name: "{{ ius_repo_url }}/ius-testing-{{ ansible_facts.distribution_major_version }}.rpm"
    state: present
  register: ius_archive
  when: ius_enable_archive | bool

# Refresh the cache now so later roles in the play can use the repository.
- name: Flush the yum cache handler.
  ansible.builtin.meta: flush_handlers

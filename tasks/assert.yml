---
- name: Assert the host is EL 7.
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'RedHat'
      - ansible_facts.distribution_major_version == '7'
    fail_msg: >-
      IUS only published packages for EL 7, got
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }}.
    quiet: true

- name: Assert ius_repo_url is an HTTP(S) URL.
  ansible.builtin.assert:
    that:
      - ius_repo_url is match('^https?://')
    fail_msg: "ius_repo_url must start with http:// or https://, got: {{ ius_repo_url }}"
    quiet: true

- name: Assert proxy_url is empty or a URL.
  ansible.builtin.assert:
    that:
      - proxy_url | length == 0 or proxy_url is match('^https?://')
    fail_msg: "proxy_url must be empty or an http(s) URL."
    quiet: true

---
galaxy_info:
  namespace: deekayen
  role_name: repo_ius
  author: Kirill Sevriugin
  description: Ansible role for IUS repository.

  github_branch: main
  issue_tracker_url: https://github.com/deekayen/ansible-role-ius/issues

  license: MIT
  min_ansible_version: "2.15"

  # IUS only published EL 7 packages. EL 7 targets need ansible-core 2.16 or
  # older, the last release that manages Python 2.7/3.6 hosts.
  platforms:
    - name: EL
      versions:
        - "7"

  galaxy_tags:
    - ius
    - repository

dependencies:
  - role: geerlingguy.repo-epel
